name: Publish Preview Audio
on:
  push:
    branches: [main]
    paths: ['preview/requests/**.json']
permissions: {contents: read, actions: read}
concurrency: {group: preview-audio-questions, cancel-in-progress: false}
jobs:
  upload-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install boto3
      - id: req
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^preview/requests/.*\.json$' | head -n1); test -n "$REQUEST"
          python -m json.tool "$REQUEST" >/dev/null
          for key in run_id artifact_name audio_filename audio_sha256 key; do value=$(jq -r --arg k "$key" '.[$k] // empty' "$REQUEST"); test -n "$value"; echo "$key=$value" >> "$GITHUB_OUTPUT"; done
      - uses: actions/download-artifact@v4
        with:
          name: "${{ steps.req.outputs.artifact_name }}"
          path: preview
          repository: "${{ github.repository }}"
          run-id: "${{ steps.req.outputs.run_id }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - env:
          FILE: "${{ steps.req.outputs.audio_filename }}"
          EXPECTED_SHA: "${{ steps.req.outputs.audio_sha256 }}"
          KEY: "${{ steps.req.outputs.key }}"
        run: |
          AUDIO="preview/$FILE"; test -s "$AUDIO"
          test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$EXPECTED_SHA"
          python - <<'PY'
          import os,boto3
          from botocore.config import Config
          c=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'].strip('"'),aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto',config=Config(s3={'addressing_style':'path'}))
          c.upload_file('preview/'+os.environ['FILE'],os.environ['R2_BUCKET'],os.environ['KEY'],ExtraArgs={'ContentType':'audio/mpeg','CacheControl':'public, max-age=3600'})
          print(os.environ['R2_PUBLIC_URL'].rstrip('/')+'/'+os.environ['KEY'])
          PY
