name: TTS Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'episodes/**'
      - '.github/workflows/tts-preview.yml'
      - 'scripts/xfyun-tools/**'

concurrency:
  group: tts-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m pip install --upgrade pip websocket-client
      - id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'episodes/*.txt')
          test "${#FILES[@]}" -eq 1 || { echo "Expected exactly one changed canonical episode"; exit 1; }
          TEXT_FILE="${FILES[0]}"; STEM=$(basename "$TEXT_FILE" .txt)
          echo "text_file=$TEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "output_name=${STEM}-preview.mp3" >> "$GITHUB_OUTPUT"
      - name: Validate secrets
        run: |
          test -n "$XFYUN_APPID"; test -n "$XFYUN_API_KEY"; test -n "$XFYUN_API_SECRET"
          mkdir -p build
      - name: Generate preview
        run: python scripts/xfyun-tools/xfyun_segmented_run.py --text-file "${{ steps.inputs.outputs.text_file }}" --out "build/${{ steps.inputs.outputs.output_name }}" --profile default --pause-ms 350
      - uses: actions/upload-artifact@v4
        with:
          name: tts-preview-${{ github.sha }}
          path: build/${{ steps.inputs.outputs.output_name }}
          if-no-files-found: error
          retention-days: 7
