name: Deploy Podcast Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'feed.xml'
      - 'cover.jpg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-podcast-questions
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare static artifact
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html feed.xml cover.jpg public/
          test -s public/index.html
          test -s public/feed.xml
          test -s public/cover.jpg
          grep -F '<title>龙虾问题</title>' public/feed.xml
          grep -F 'ep003-beautiful-things-dont-ask-for-attention' public/feed.xml
      - uses: actions/upload-pages-artifact@v4
        with: {path: ./public}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
